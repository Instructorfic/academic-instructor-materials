<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las cuatro áreas de Git: directorio de trabajo, área de preparación, repositorio local y repositorio remoto">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a3161"/>
    </marker>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6470"/>
    </marker>
  </defs>

  <!-- Directorio de trabajo -->
  <rect x="10" y="80" width="190" height="130" rx="10" fill="#ffffff" stroke="#0a3161" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a3161">Directorio de</text>
  <text x="105" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a3161">trabajo</text>
  <text x="105" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">Los archivos que</text>
  <text x="105" y="177" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">estás editando</text>
  <text x="105" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">ahora mismo</text>

  <line x1="200" y1="145" x2="238" y2="145" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="219" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a6c1a">git add</text>

  <!-- Área de preparación -->
  <rect x="240" y="80" width="190" height="130" rx="10" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/>
  <text x="335" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a6c1a">Área de</text>
  <text x="335" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a6c1a">preparación</text>
  <text x="335" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a6c1a">(staging area)</text>
  <text x="335" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">Lo que decidiste</text>
  <text x="335" y="187" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">incluir en el próximo</text>
  <text x="335" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">commit</text>

  <line x1="430" y1="145" x2="468" y2="145" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="449" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a6c1a">git commit</text>

  <!-- Repositorio local -->
  <rect x="470" y="80" width="190" height="130" rx="10" fill="#eaf1fb" stroke="#0a3161" stroke-width="2"/>
  <text x="565" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a3161">Repositorio</text>
  <text x="565" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0a3161">local</text>
  <text x="565" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">El historial guardado</text>
  <text x="565" y="177" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">en tu propia</text>
  <text x="565" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">computadora</text>

  <!-- Repositorio remoto -->
  <rect x="700" y="80" width="190" height="130" rx="10" fill="#f7f8fa" stroke="#5a6470" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="795" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#5a6470">Repositorio</text>
  <text x="795" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#5a6470">remoto</text>
  <text x="795" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">GitHub o GitLab</text>
  <text x="795" y="177" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">compartido con</text>
  <text x="795" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1c1f24">todo el equipo</text>

  <!-- push / pull entre repo local y remoto -->
  <line x1="662" y1="130" x2="698" y2="130" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="680" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#8a6c1a">git push</text>

  <line x1="698" y1="165" x2="662" y2="165" stroke="#5a6470" stroke-width="2" marker-end="url(#flecha-gris)"/>
  <text x="680" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#5a6470">git pull</text>

  <text x="450" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c1f24">Un archivo pasa por estas cuatro áreas antes de que otra persona del equipo lo vea</text>
</svg>
