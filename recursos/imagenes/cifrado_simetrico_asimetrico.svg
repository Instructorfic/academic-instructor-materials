<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <!-- ============ PANEL 1: SIMÉTRICO ============ -->
  <text x="30" y="35" font-size="20" font-weight="bold" fill="#111827">Cifrado simétrico</text>
  <text x="30" y="55" font-size="13" fill="#6b7280">La misma llave cifra y descifra</text>

  <rect x="60" y="90" width="140" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="130" font-size="14" fill="#1e3a8a" text-anchor="middle">Cliente</text>

  <rect x="620" y="90" width="140" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="130" font-size="14" fill="#1e3a8a" text-anchor="middle">Servidor</text>

  <line x1="200" y1="125" x2="620" y2="125" stroke="#16a34a" stroke-width="3"/>
  <rect x="380" y="105" width="60" height="40" rx="6" fill="#16a34a"/>
  <text x="410" y="130" font-size="20" fill="#ffffff" text-anchor="middle">🔑</text>
  <text x="410" y="170" font-size="12" fill="#16a34a" text-anchor="middle">misma llave en ambos lados</text>

  <text x="130" y="200" font-size="11" fill="#374151" text-anchor="middle">Ejemplo: pgcrypto</text>
  <text x="690" y="200" font-size="11" fill="#374151" text-anchor="middle">Ejemplo: pgcrypto</text>

  <!-- ============ PANEL 2: ASIMÉTRICO / SSH ============ -->
  <text x="30" y="260" font-size="20" font-weight="bold" fill="#111827">Cifrado asimétrico — SSH puerto 22</text>
  <text x="30" y="280" font-size="13" fill="#6b7280">Cada lado tiene una llave distinta la privada nunca viaja</text>

  <rect x="60" y="315" width="160" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="345" font-size="14" fill="#991b1b" text-anchor="middle">Tu computadora</text>
  <text x="140" y="365" font-size="12" fill="#991b1b" text-anchor="middle">llave privada</text>
  <text x="140" y="380" font-size="11" fill="#991b1b" text-anchor="middle">id_ed25519</text>

  <rect x="600" y="315" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="345" font-size="14" fill="#14532d" text-anchor="middle">Servidor :22</text>
  <text x="690" y="365" font-size="12" fill="#14532d" text-anchor="middle">llave pública</text>
  <text x="690" y="380" font-size="11" fill="#14532d" text-anchor="middle">authorized_keys</text>

  <path d="M 220 340 L 600 340" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="330" font-size="11" fill="#7c3aed" text-anchor="middle">1 solicita conectarse</text>

  <path d="M 600 365 L 220 365" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="410" y="415" font-size="11" fill="#d97706" text-anchor="middle">2 envía un reto (challenge)</text>

  <text x="410" y="435" font-size="11" fill="#374151" text-anchor="middle">3 tu computadora responde con la llave privada sin transmitirla el servidor verifica con la pública</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
